<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Lite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TaskFlow Lite</h1>
        <p>Your client-side task management solution</p>
    </header>

    <main>
        <section id="task-manager">
            <form id="taskForm">
                <input type="text" id="taskInput" placeholder="Enter a new task" required>
                <button type="submit">Add Task</button>
            </form>

            <ul id="taskList"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 TaskFlow Lite</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
